{% extends "dashboard/base_dash.html" %}
{% block dtitle %}Banner{% endblock %}
{% block dash %}
<h1 style="font-size:2rem">{% if banner %}Edit banner{% else %}New banner{% endif %}</h1>
<form method="post" enctype="multipart/form-data" class="card stack" style="max-width:820px">{% csrf_token %}{% include "dashboard/_fields.html" %}
  <div class="row"><button class="btn btn-navy">Save banner</button><a class="btn btn-ghost" href="{% url 'dashboard:banner_list' %}">Cancel</a></div></form>
{% endblock %}
