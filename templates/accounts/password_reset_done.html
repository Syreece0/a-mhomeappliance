{% extends "base.html" %}
{% block title %}Check your email - {{ biz.business_name }}{% endblock %}
{% block content %}

  <div style="font-size:3rem">&#9993;</div><h1 style="font-size:2rem">Check your email</h1>

</div></div></div>
