{% extends "base.html" %}
{% block title %}Change password - {{ biz.business_name }}{% endblock %}
{% block content %}
<div class="container"><div class="auth-wrap"><div class="card stack">
  <h1 style="font-size:2rem">Change password</h1>
  <form method="post" class="stack">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label><input class="form-control" type="password" name="{{ f.html_name }}" id="{{ f.id_for_label }}" required>{{ f.errors }}{% if f.help_text %}<div class="help">{{ f.help_text|safe }}</div>{% endif %}</div>{% endfor %}
    <button class="btn btn-navy" type="submit">Update password</button>
  </form>
</div></div></div>
{% endblock %}
