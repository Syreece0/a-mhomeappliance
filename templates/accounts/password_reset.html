{% extends "base.html" %}
{% block title %}Reset password - {{ biz.business_name }}{% endblock %}
{% block content %}
<div class="container"><div class="auth-wrap"><div class="card stack">
  <h1 style="font-size:2rem">Forgot your password?</h1>
  <p class="muted">Enter your email and we'll send you a link to choose a new one.</p>
  <form method="post" class="stack">{% csrf_token %}
    <div class="field"><label for="{{ form.email.id_for_label }}">Email</label>{{ form.email }}{{ form.email.errors }}</div>
    <button class="btn btn-navy" type="submit">Send reset link</button>
  </form>
</div></div></div>
{% endblock %}
